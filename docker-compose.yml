# Levanta backend (FastAPI) + PostgreSQL para HabitQ.
# Requiere un .env en esta misma carpeta (ver .env.example) con al menos
# JWT_SECRET, GOOGLE_CLIENT_ID y GEMINI_API_KEY.
#
# Uso:
#   cp .env.example .env   # completar los valores reales
#   docker compose up --build
#
# La API queda expuesta en http://localhost:8000 (health check en /health).
# Nota: la app mobile (Flutter) NO corre en este compose, ver limitaciones
# al final de la guía.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habitq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitq}
      POSTGRES_DB: ${POSTGRES_DB:-habitq}
    volumes:
      - habitq_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habitq} -d ${POSTGRES_DB:-habitq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-habitq}:${POSTGRES_PASSWORD:-habitq}@db:5432/${POSTGRES_DB:-habitq}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"

volumes:
  habitq_pgdata:
